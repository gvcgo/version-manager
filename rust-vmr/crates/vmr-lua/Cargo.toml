[package]
name = "vmr-lua"
version = "0.1.0"
edition = "2021"
description = "VMR Lua plugin system — mlua bindings compatible with existing .lua plugins"

[dependencies]
vmr-config = { path = "../vmr-config" }
vmr-utils = { path = "../vmr-utils" }
mlua = { version = "0.10", features = ["vendored", "lua54"] }
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
