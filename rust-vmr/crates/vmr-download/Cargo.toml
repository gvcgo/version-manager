[package]
name = "vmr-download"
version = "0.1.0"
edition = "2021"
description = "VMR SDK file downloader — multi-threaded HTTP with checksum verification"

[dependencies]
vmr-config = { path = "../vmr-config" }
vmr-utils = { path = "../vmr-utils" }
reqwest = { version = "0.12", features = ["blocking", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
