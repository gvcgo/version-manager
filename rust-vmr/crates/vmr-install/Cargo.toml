[package]
name = "vmr-install"
version = "0.1.0"
edition = "2021"
description = "VMR SDK installer — archive/coursier/executable install strategies"

[dependencies]
vmr-config = { path = "../vmr-config" }
vmr-utils = { path = "../vmr-utils" }
vmr-download = { path = "../vmr-download" }
vmr-shell = { path = "../vmr-shell" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
