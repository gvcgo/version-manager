[package]
name = "vmr-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "shell hooks: bash/zsh/fish/powershell env injection and cd hook (plan §3.8)"

[dependencies]
vmr-core = { path = "../vmr-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
