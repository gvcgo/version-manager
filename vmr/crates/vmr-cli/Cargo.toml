[package]
name = "vmr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vmr command line entry (plan §3.10)"

[[bin]]
name = "vmr"
path = "src/main.rs"

[dependencies]
vmr-core = { path = "../vmr-core" }
vmr-utils = { path = "../vmr-utils" }
vmr-net = { path = "../vmr-net" }
vmr-lua = { path = "../vmr-lua" }
vmr-pixi = { path = "../vmr-pixi" }
vmr-env = { path = "../vmr-env" }
vmr-shell = { path = "../vmr-shell" }
vmr-pty = { path = "../vmr-pty" }
vmr-installer = { path = "../vmr-installer" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
toml = { workspace = true }
regex = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
