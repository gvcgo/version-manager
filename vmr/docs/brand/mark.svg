<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 140 140" role="img" aria-label="vmr">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#C96B33" stop-opacity="0.16"/>
      <stop offset="62%" stop-color="#E8A052" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8A052" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#E8A052" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#C96B33" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#C96B33" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="grass" gradientUnits="userSpaceOnUse" x1="0" y1="122" x2="0" y2="54">
      <stop offset="0%" stop-color="#2F6B4C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5E9464" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="blade" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <ellipse cx="64" cy="74" rx="58" ry="50" fill="url(#halo)"/>

  <!-- ===== cat ===== -->
  <g filter="url(#soft)" opacity="0.26">
    <path d="M38 62 C31 74 29 88 31 100 C33 112 43 120 56 120 C70 120 80 112 82 100 C84 88 81 74 76 62 Z" fill="#C96B33"/>
    <circle cx="56" cy="50" r="18" fill="#C96B33"/>
  </g>

  <g filter="url(#rough)">
    <!-- tail with white tip -->
    <path d="M80 98 C92 100 97 108 94 116 C91 123 83 125 77 121" fill="none" stroke="#C96B33" stroke-width="8.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M88 119.5 C89 121.5 87 123 84 123 C82 123 80.5 122.4 79.5 121.4" fill="none" stroke="#FBF6EC" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <!-- body -->
    <path d="M38 62 C31 74 29 88 31 100 C33 112 43 120 56 120 C70 120 80 112 82 100 C84 88 81 74 76 62 Z" fill="url(#fur)"/>
    <!-- ears -->
    <path d="M42 44 C39 36 36 29 34 25 C29 30 27 38 28 46 C33 46 38 46 42 44 Z" fill="url(#fur)"/>
    <path d="M62 42 C67 36 71 30 76 26 C80 32 80 39 79 46 C74 46 67 45 62 42 Z" fill="url(#fur)"/>
    
    
    <!-- head -->
    <path d="M56 34 C68 34 76 41 76 51 C76 62 68 70 56 70 C44 70 36 62 36 51 C36 41 44 34 56 34 Z" fill="url(#fur)"/>
  </g>

  <!-- white markings: muzzle, chest, paws -->
  <path d="M56 57 C62 57 67 60 67 63.5 C67 67 62 69.5 56 69.5 C50 69.5 45 67 45 63.5 C45 60 50 57 56 57 Z" fill="#FBF6EC" opacity="0.95"/>
  <path d="M56 69 C61 70 64 74 65 80 C66 90 64 100 63 106 C62 110 59 112 56 112 C53 112 50 110 49 106 C48 100 46 90 47 80 C48 74 51 70 56 69 Z" fill="#FBF6EC" opacity="0.88"/>
  <path d="M56 69 C50 69 46 72 45 77 C48 75 52 74 56 74 C60 74 64 75 67 77 C66 72 62 69 56 69 Z" fill="#FBF6EC" opacity="0.55"/>
  <g fill="#FBF6EC" opacity="0.92">
    <ellipse cx="48" cy="115" rx="7.5" ry="4.6"/>
    <ellipse cx="64" cy="115" rx="7.5" ry="4.6"/>
  </g>
  <!-- toe lines -->
  <g stroke="#3A2A20" stroke-width="0.8" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M48 112 V117 M50 112.4 V117.2 M46 112.4 V117.2"/>
    <path d="M64 112 V117 M66 112.4 V117.2 M62 112.4 V117.2"/>
  </g>

  <!-- tabby hints -->
  <g stroke="#A3441F" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M51 38 C54 40 58 40 61 38" stroke-width="1.8"/>
    <path d="M53 43 C55 44 57 44 59 43" stroke-width="1.5"/>
  </g>

  <!-- face -->
  <g stroke="#3A2A20" fill="none" stroke-linecap="round" stroke-width="2.4">
    <path d="M45 52 C47 56 51 56 53 52"/>
    <path d="M60 52 C62 56 66 56 68 52"/>
  </g>
  <path d="M56.5 58 L60 59.8 L56.5 62.4 Z" fill="#A3441F"/>
  <path d="M56.5 62.4 C56.5 65 54 66 52.5 64.6 M56.5 62.4 C56.5 65 59 66 60.5 64.6" fill="none" stroke="#3A2A20" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>

  <!-- whiskers -->
  <g stroke="#3A2A20" stroke-linecap="round" fill="none">
    <path d="M45 60 C40 58.5 35 58 31 58" stroke-width="1" opacity="0.42"/>
    <path d="M44 64 C39 65 34 66 30 67.5" stroke-width="1" opacity="0.38"/>
    <path d="M68 60 C73 58.5 78 58 82 58" stroke-width="1" opacity="0.42"/>
    <path d="M69 64 C74 65 79 66 83 67.5" stroke-width="1" opacity="0.38"/>
  </g>

  <g filter="url(#blade)" stroke="#5E9464" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M28 123 C29 117 29 112 27 108" stroke-width="2.2"/>
    <path d="M32 123 C35 119 36 115 35 112" stroke-width="1.8"/>
    <path d="M24 123 C22 119 21 116 22 113" stroke-width="1.6"/>
  </g>

  <g transform="rotate(-4 115 115)">
    <rect x="104" y="104" width="22" height="22" rx="4" fill="#B5432F"/>
    <text x="115" y="119.5" font-family="ui-monospace, Menlo, monospace" font-size="8.5" font-weight="700" fill="#FBF6EC" text-anchor="middle">vmr</text>
  </g>
</svg>
