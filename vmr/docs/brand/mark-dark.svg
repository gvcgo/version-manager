  <path d="M70 27 C83 27 92 33 94 43 C96 51 96 57 93 62 C89 68 81 71 70 71 C59 71 51 68 47 62 C44 57 44 51 46 43 C48 33 57 27 70 27 Z" fill="url(#headG)"/>
  <path d="M70 27 C83 27 92 33 94 43 C96 51 96 57 93 62 C89 68 81 71 70 71 Z" fill="url(#headLight)"/>
