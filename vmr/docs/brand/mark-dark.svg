    <path d="M93 50 C97 51 99 53.5 98.5 56 C96.5 56 94.5 56.6 93 57.4 C95 58.4 96 60 95.4 61.6 C93.8 62.2 92.6 62.2 91.6 62.2 Z"/>
  </g>

