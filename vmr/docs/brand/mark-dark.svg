  <path d="M70 66 C66 69 61 80 60.5 92 C60 104 64 114 70 114 C76 114 80 104 79.5 92 C79 80 74 69 70 66 Z" fill="url(#whiteG)"/>
  <path d="M70 66 C66.5 68 63.5 73 61.8 79 C64.5 75.8 67 74.6 70 74.6 C73 74.6 75.5 75.8 78.2 79 C76.5 73 73.5 68 70 66 Z" fill="#FFFFFF"/>

