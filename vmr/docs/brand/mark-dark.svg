  <g stroke="#B8652A" stroke-width="0.85" fill="none" opacity="0.32" stroke-linecap="round">
    <path d="M62 34 C63 37 62 39.5 60 41.5"/>
    <path d="M70 31 C71 34 70.4 37 69 39"/>
    <path d="M78 34 C77 37 78 39.5 80 41.5"/>
