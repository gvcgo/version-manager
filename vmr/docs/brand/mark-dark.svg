  <path d="M66.8 56.4 C68.2 55.6 71.8 55.6 73.2 56.4 C72.8 58.4 71.2 59.6 70 59.6 C68.8 59.6 67.2 58.4 66.8 56.4 Z" fill="#DE8E7E"/>
  <path d="M70 59.6 V62.2" stroke="#8C6A52" stroke-width="1.05" stroke-linecap="round"/>
