      <stop offset="0%" stop-color="#F0A659"/>
      <stop offset="45%" stop-color="#E08C3B"/>
      <stop offset="100%" stop-color="#B45B22"/>
    </linearGradient>
    <linearGradient id="headG" x1="0.3" y1="0.05" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F6B36C"/>
      <stop offset="42%" stop-color="#E9953F"/>
      <stop offset="100%" stop-color="#C0662A"/>
    </linearGradient>
    <linearGradient id="earG" x1="0.4" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#EFA354"/>
      <stop offset="100%" stop-color="#C4682B"/>
    </linearGradient>
    <linearGradient id="whiteG" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FCF4E6"/>
      <stop offset="100%" stop-color="#E3D0B3"/>
