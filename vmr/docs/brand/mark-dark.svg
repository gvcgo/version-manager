  <path d="M56 66 C50 76 48 88 48 96 C48 106 46 115 48.5 121 C51.5 128 60 131 70 131 C80 131 88.5 128 91.5 121 C94 115 92 106 92 96 C92 88 90 76 84 66 Z" fill="url(#bodyG)"/>
  <!-- body shading: right side -->
