<svg xmlns="http://www.w3.org/2000/svg" width="656" height="280" viewBox="0 0 328 140" role="img" aria-label="vmr">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#C96B33" stop-opacity="0.16"/>
      <stop offset="62%" stop-color="#E8A052" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8A052" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#E8A052" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#C96B33" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#C96B33" stop-opacity="0.86"/>
