name: "vmr CodeQL config"

queries:
  # Same suite as the previous default setup (which ran `security-extended`).
  - uses: security-extended

# Mirrors the `threat_model: remote_and_local` that default setup ran with. Threat models are still
# a preview restricted to Java/Kotlin and C# (GitHub docs), so for the Rust analysis this is a no-op:
# `rust/command-line-injection` on `vmr-pty` is reported on `main` with or without it. Pull-request
# runs report only alerts in changed files (CodeQL diff-informed analysis), so a PR that does not
# touch the flagged file shows 0 results - that is expected, not missing coverage.
threat-models: local

query-filters:
  # `vmr` is a version manager: every file-system sink is reached from a CLI argument, a config
  # value, or an archive entry name, so this query fires on all ~140 sinks by design. It also
  # reports the unit tests in `#[cfg(test)]` modules (paths derived from `TempDir`), which cannot
  # be excluded separately because CodeQL has no per-directory test notion for Rust and no
  # in-source suppression for Rust queries (github/codeql#21637).
  #
  # The one class that matters here is archive extraction: `unpack_zip`/`unpack_tar` feed entry
  # names through `safe_join` (rejects `..` and absolute paths) and that guard is pinned by
  # `extract::tests::rejects_path_traversal_entries`.
  #
  # Command execution stays enabled: `rust/command-line-injection` is the query this repository
  # actually wants reviewed, since `vmr` executes shell hooks and plugin-provided commands.
  - exclude:
      id: rust/path-injection
