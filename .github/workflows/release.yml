name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. vmr-v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: vmr

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            kind: unix
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            kind: unix
          - target: x86_64-apple-darwin
            os: macos-15-intel
            kind: unix
          - target: aarch64-apple-darwin
            os: macos-15
            kind: unix
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            kind: windows
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            kind: windows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Pinned to a master-branch commit (2026-10-16); see the note in ci.yml. A SHA ref requires
      # the toolchain to be passed explicitly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vmr -> target

      - name: build
        run: cargo build --release --locked -p vmr-cli --bin vmr

      - name: package (unix)
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          name="vmr-${{ matrix.target }}"
          mkdir -p "stage/$name"
          cp target/release/vmr "stage/$name/vmr"
          cp readme.md "stage/$name/README.md"
          tar -C stage -cJf "$name.tar.xz" "$name"
          tar -tJf "$name.tar.xz"

      - name: package (windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $name = "vmr-${{ matrix.target }}"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\vmr.exe $stage
          Copy-Item readme.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "$name.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: vmr/vmr-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: |
          for f in *.tar.xz *.zip; do sha256sum "$f" > "$f.sha256"; done
          sha256sum *.tar.xz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: upload to release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" * --clobber --repo "${{ github.repository }}"

  homebrew:
    name: homebrew tap
    needs: publish
    runs-on: ubuntu-22.04
    # The workflow-level default runs in vmr/; these jobs work from the repository root.
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # A release runs the workflow from its own tag; a manual dispatch reuses the packaging
          # scripts from the dispatched ref, which is what makes retrying an older tag possible.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: skip without a publish token
        if: env.PUBLISH_TOKEN == ''
        run: echo "::warning::TAP_GITHUB_TOKEN is unset; the Homebrew tap was not updated"

      - name: render Formula/vmr.rb
        if: env.PUBLISH_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          mkdir -p work
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --dir work
          vmr/packaging/render.sh vmr/packaging/homebrew/vmr.rb.in "$version" \
            work/SHA256SUMS work/Formula/vmr.rb
          cat work/Formula/vmr.rb

      - name: push to gvcgo/homebrew-tap
        if: env.PUBLISH_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/gvcgo/homebrew-tap.git" checkout
          mkdir -p checkout/Formula
          cp work/Formula/vmr.rb checkout/Formula/vmr.rb
          vmr/packaging/commit-repo.sh checkout "vmr $version" Formula/vmr.rb

  macports:
    name: macports port source
    needs: publish
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # A release runs the workflow from its own tag; a manual dispatch reuses the packaging
          # scripts from the dispatched ref, which is what makes retrying an older tag possible.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: skip without a publish token
        if: env.PUBLISH_TOKEN == ''
        run: echo "::warning::TAP_GITHUB_TOKEN is unset; the MacPorts port source was not updated"

      - name: render devel/vmr/Portfile
        if: env.PUBLISH_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          mkdir -p work
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --dir work
          vmr/packaging/render.sh vmr/packaging/macports/Portfile.in "$version" \
            work/SHA256SUMS work/Portfile
          cat work/Portfile

      - name: push to gvcgo/vmr-macports
        if: env.PUBLISH_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/gvcgo/vmr-macports.git" checkout
          mkdir -p checkout/devel/vmr
          cp work/Portfile checkout/devel/vmr/Portfile
          cp vmr/packaging/macports/README.md checkout/README.md
          vmr/packaging/commit-repo.sh checkout "vmr $version" devel/vmr/Portfile README.md

  scoop:
    name: scoop bucket
    needs: publish
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # A release runs the workflow from its own tag; a manual dispatch reuses the packaging
          # scripts from the dispatched ref, which is what makes retrying an older tag possible.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: skip without a publish token
        if: env.PUBLISH_TOKEN == ''
        run: echo "::warning::TAP_GITHUB_TOKEN is unset; bucket/vmr.json was not updated"

      - name: render bucket/vmr.json
        if: env.PUBLISH_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          mkdir -p work
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --dir work
          vmr/packaging/render.sh vmr/packaging/scoop/vmr.json.in "$version" \
            work/SHA256SUMS work/bucket/vmr.json
          python3 -m json.tool work/bucket/vmr.json >/dev/null
          cat work/bucket/vmr.json

      - name: push to gvcgo/scoop-bucket
        if: env.PUBLISH_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/gvcgo/scoop-bucket.git" checkout
          mkdir -p checkout/bucket
          cp work/bucket/vmr.json checkout/bucket/vmr.json
          vmr/packaging/commit-repo.sh checkout "vmr $version" bucket/vmr.json

  apt:
    name: apt repository
    needs: publish
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # A release runs the workflow from its own tag; a manual dispatch reuses the packaging
          # scripts from the dispatched ref, which is what makes retrying an older tag possible.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: skip without a publish token or signing key
        if: env.PUBLISH_TOKEN == '' || env.APT_GPG_PRIVATE_KEY == ''
        run: echo "::warning::TAP_GITHUB_TOKEN or APT_GPG_PRIVATE_KEY is unset; the APT repository was not updated"

      - name: import the signing key
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          if [ -z "$key" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY did not import a secret key"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "APT_GPG_KEY=$key" >>"$GITHUB_ENV"

      - name: download the linux archives
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/artifacts
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'vmr-*-unknown-linux-gnu.tar.xz' --dir work/artifacts
          ls -l work/artifacts

      - name: build and sign the repository
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/gvcgo/vmr-apt.git" checkout
          vmr/packaging/apt/build-repo.sh "$version" work/artifacts checkout
          find checkout/pool checkout/dists -type f | sort

      - name: push to gvcgo/vmr-apt
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          vmr/packaging/commit-repo.sh checkout "vmr $version" pool dists vmr.gpg

  pacman:
    name: pacman repository
    needs: publish
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # A release runs the workflow from its own tag; a manual dispatch reuses the packaging
          # scripts from the dispatched ref, which is what makes retrying an older tag possible.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: skip without a publish token or signing key
        if: env.PUBLISH_TOKEN == '' || env.APT_GPG_PRIVATE_KEY == ''
        run: echo "::warning::TAP_GITHUB_TOKEN or APT_GPG_PRIVATE_KEY is unset; the pacman repository was not updated"

      - name: import the signing key
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          if [ -z "$key" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY did not import a secret key"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "PACMAN_GPG_KEY=$key" >>"$GITHUB_ENV"

      - name: download the linux archive
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --pattern 'vmr-x86_64-unknown-linux-gnu.tar.xz' --dir work
          ls -l work

      - name: render PKGBUILD
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          vmr/packaging/render.sh vmr/packaging/arch/PKGBUILD.in "$version" \
            work/SHA256SUMS work/PKGBUILD
          cat work/PKGBUILD

      - name: build and publish in an Arch container
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/gvcgo/vmr-pacman.git" work/checkout
          cp vmr/packaging/arch/build-repo.sh vmr/packaging/arch/verify.sh work/
          chmod +x work/build-repo.sh work/verify.sh
          docker run --rm \
            -v "$PWD/work:/work" \
            -v "$GNUPGHOME:/gnupg" \
            -e GNUPGHOME=/gnupg \
            -e PACMAN_GPG_KEY="$PACMAN_GPG_KEY" \
            -w /work archlinux:base-devel bash -c '
              set -euo pipefail
              pacman -Sy --needed --noconfirm base-devel >/dev/null
              useradd -m builder
              mkdir -p /home/builder/build
              cp PKGBUILD vmr-x86_64-unknown-linux-gnu.tar.xz /home/builder/build/
              chown -R builder /home/builder/build
              su builder -c "cd /home/builder/build && makepkg -f --nodeps --noconfirm"
              ./build-repo.sh /work/checkout /home/builder/build/vmr-*.pkg.tar.zst
            '

      - name: verify the package installs
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/work/checkout:/repo:ro" \
            -v "$PWD/work/verify.sh:/verify.sh:ro" \
            archlinux:base bash /verify.sh /repo

      - name: push to gvcgo/vmr-pacman
        if: env.PUBLISH_TOKEN != '' && env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          version="${TAG#vmr-}"
          version="${version#v}"
          vmr/packaging/commit-repo.sh work/checkout "vmr $version" x86_64 vmr.gpg
