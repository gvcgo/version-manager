name: ci

# The repository had no check on pull requests: `release` only builds on tags, so a dependency
# bump that does not compile (dependabot bumps zip 2 -> 9 without the API adaptation, for example)
# was only discovered at release time.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: vmr

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vmr -> target

      - name: check
        run: cargo check --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vmr -> target

      - name: test
        run: cargo test --workspace --locked
