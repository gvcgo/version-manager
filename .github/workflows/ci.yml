name: ci

# The repository had no check on pull requests: `release` only builds on tags, so a dependency
# bump that does not compile (dependabot bumps zip 2 -> 9 without the API adaptation, for example)
# was only discovered at release time.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: vmr

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned to a master-branch commit (2026-10-16) per the action's guidance: a SHA outside
      # master's history can be garbage-collected, and the toolchain must then be explicit.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vmr -> target

      - name: check
        run: cargo check --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned to a master-branch commit (2026-10-16) per the action's guidance: a SHA outside
      # master's history can be garbage-collected, and the toolchain must then be explicit.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vmr -> target

      - name: test
        run: cargo test --workspace --locked
